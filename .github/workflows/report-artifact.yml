name: Publish Playwright HTML Report Artifact

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-report-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:all
        continue-on-error: true

      - name: Generate custom HTML dashboard
        run: npm run report:custom

      - name: Create ZIP artifact
        run: |
          mkdir -p artifact
          cp -r reports/* artifact/
          zip -r playwright-report-dashboard.zip artifact

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dashboard
          path: playwright-report-dashboard.zip
          retention-days: 30
