name: Publish Playwright HTML Report Artifact

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-report-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:all
        continue-on-error: true

      - name: Generate custom HTML dashboard
        run: npm run report:custom

      - name: Create ZIP artifact
        run: |
          mkdir -p artifact
          cp -R reports/. artifact/
          zip -r playwright-report-dashboard-${{ github.run_id }}.zip artifact

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dashboard-${{ github.run_id }}
          path: playwright-report-dashboard-${{ github.run_id }}.zip
          retention-days: 30

      - name: Add artifact link to job summary
        if: success()
        run: |
          echo "## Playwright Report Artifact" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifact name: playwright-report-dashboard-${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "Download from the Artifacts section of this workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
