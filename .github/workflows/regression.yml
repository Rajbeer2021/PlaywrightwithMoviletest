
name: OrangeHRM Regression

on:
  workflow_dispatch:
    inputs:
      run_target:
        description: Choose where to run the regression suite
        required: false
        type: choice
        default: github
        options:
          - github
          - browserstack
      github_browser:
        description: GitHub runner browser for regression tests
        required: false
        type: choice
        default: windows-chrome
        options:
          - windows-chrome
          - windows-edge
          - windows-firefox
      browserstack_project:
        description: BrowserStack target project when BrowserStack is selected
        required: false
        type: choice
        default: windows-chrome
        options:
          - windows-chrome
          - windows10-chrome
          - windows-edge
          - windows-firefox
          - macos-safari
          - samsung-s25-chrome
          - pixel10-chrome
          - pixel9-chrome

jobs:
  regression:
    name: Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run regression tests on GitHub runner
        if: ${{ inputs.run_target == 'github' }}
        run: |
          echo "Running GitHub regression tests on ${{ inputs.github_browser }}"
          npm run test:regression

      - name: Run regression tests on BrowserStack
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_target == 'browserstack' }}
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_CONFIG_FILE_PATH: ./browserstack.yml
          BROWSERSTACK_LOG_DIR: ./reports/log
          BROWSERSTACK_LOG_LEVEL: error
        run: |
          echo "Running BrowserStack regression tests on ${{ inputs.browserstack_project }}"
          npx browserstack-node-sdk playwright test tests/orangehrm.spec.js -- --config=playwright.browserstack.config.js --project=${{ inputs.browserstack_project }}

      - name: Generate custom HTML report
        if: always()
        run: npm run report:custom

      - name: Publish reports and upload zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ github.run_id }}
          path: |
            reports/
          retention-days: 30
