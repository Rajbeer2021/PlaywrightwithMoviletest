
name: OrangeHRM Smoke Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      github_browser:
        description: GitHub runner browser for smoke tests
        required: false
        type: choice
        default: windows-chrome
        options:
          - windows-chrome
          - windows-edge
          - windows-firefox

jobs:
  smoke:
    name: Smoke Execution
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      RUNNER_BROWSER: ${{ github.event_name == 'workflow_dispatch' && inputs.github_browser || 'windows-chrome' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests on GitHub runner
        run: |
          echo "Running GitHub smoke tests on $RUNNER_BROWSER"
          npm run test:smoke

      - name: Generate custom HTML report
        if: always()
        run: npm run report:custom

      - name: Publish reports and upload zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report-${{ github.run_id }}
          path: |
            reports/
          retention-days: 15
