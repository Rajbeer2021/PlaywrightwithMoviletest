name: OrangeHRM Sanity Tests

on:
  workflow_dispatch:
    inputs:
      github_browser:
        description: GitHub runner browser for sanity tests
        required: false
        type: choice
        default: windows-chrome
        options:
          - windows-chrome
          - windows-edge
          - windows-firefox

jobs:
  sanity:
    name: Sanity Execution
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run sanity tests on GitHub runner
        run: |
          echo "Running GitHub sanity tests on ${{ inputs.github_browser }}"
          npm run test:sanity

      - name: Generate custom HTML report
        if: always()
        run: npm run report:custom

      - name: Publish reports and upload zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-test-report-${{ github.run_id }}
          path: |
            reports/
          retention-days: 15
