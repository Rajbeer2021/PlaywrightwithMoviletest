name: Playwright BrowserStack Tests

on:
  workflow_dispatch:
    inputs:
      browserstack_project:
        description: BrowserStack target project for on-demand runs
        required: false
        type: choice
        default: windows-chrome
        options:
          - windows-chrome
          - windows10-chrome
          - windows-edge
          - windows-firefox
          - macos-safari
          - samsung-s25-chrome
          - samsung-s24-chrome
          - pixel10-chrome
          - pixel9-chrome

jobs:
  browserstack-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_CONFIG_FILE_PATH: ./browserstack.yml
      BROWSERSTACK_LOG_DIR: ./reports/log
      BROWSERSTACK_LOG_LEVEL: error

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run BrowserStack Playwright tests
        run: |
          npx browserstack-node-sdk playwright test tests/orangehrm.spec.js -- --config=playwright.browserstack.config.js

      - name: Generate custom HTML report
        if: always()
        run: npm run report:custom

      - name: Publish reports and upload zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-report-${{ github.run_id }}
          path: |
            reports/
          retention-days: 15