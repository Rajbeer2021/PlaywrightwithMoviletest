
# BrowserStack SDK matrix config.
# The BrowserStack SDK expands every platform listed here.
# This project supports Android mobile and desktop browser combinations.
# If you want to run a single target, keep only one platform entry.

userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: OrangeHRM Playwright Automation
buildName: GitHub Actions BrowserStack Build
buildIdentifier: '#${BUILD_NUMBER}'

framework: playwright
logDir: ./reports/log
logLevel: error

platforms:
  - os: Windows
    osVersion: "11"
    browserName: chrome
    browserVersion: latest
    playwrightConfigOptions:
      name: windows-chrome

  - os: Windows
    osVersion: "10"
    browserName: chrome
    browserVersion: latest
    playwrightConfigOptions:
      name: windows10-chrome

  - os: Windows
    osVersion: "11"
    browserName: edge
    browserVersion: latest
    playwrightConfigOptions:
      name: windows-edge

  - os: Windows
    osVersion: "11"
    browserName: firefox
    browserVersion: latest
    playwrightConfigOptions:
      name: windows-firefox

  - os: macOS
    osVersion: "Ventura"
    browserName: safari
    browserVersion: latest
    playwrightConfigOptions:
      name: macos-safari

  - os: Android
    osVersion: "14"
    deviceName: "Google Pixel 10"
    browserName: chrome
    browserVersion: latest
    playwrightConfigOptions:
      name: pixel10-chrome

  - os: Android
    osVersion: "14"
    deviceName: "Google Pixel 9"
    browserName: chrome
    browserVersion: latest
    playwrightConfigOptions:
      name: pixel9-chrome

  - os: Android
    osVersion: "15"
    deviceName: "Samsung Galaxy S25"
    browserName: chrome
    browserVersion: latest
    playwrightConfigOptions:
      name: samsung-s25-chrome

  - os: Android
    osVersion: "14"
    deviceName: "Samsung Galaxy S24"
    browserName: chrome
    browserVersion: latest
    playwrightConfigOptions:
      name: samsung-s24-chrome

# BrowserStack debugging
debug: false
networkLogs: false
video: true
consoleLogs: info
