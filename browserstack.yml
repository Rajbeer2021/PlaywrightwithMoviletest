
# Single-target BrowserStack config.
# This is the reliable setup for this project because the BrowserStack SDK expands every platform defined in the YAML.
# If you need a different OS/browser, update this file before running the tests.
# Credentials: use environment variables; do not commit secrets.
# The real values must be set in GitHub repository secrets and injected at runtime.
#userName: ${BROWSERSTACK_USERNAME}
#accessKey: ${BROWSERSTACK_ACCESS_KEY}

userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

framework: playwright

projectName: OrangeHRM Playwright Automation
buildName: GitHub Actions BrowserStack Build
buildIdentifier: '#${BUILD_NUMBER}'

framework: playwright
logLevel: error

platforms:
  - os: Windows
    osVersion: "11"
    browserName: chrome
    browserVersion: latest
    playwrightConfigOptions:
      name: windows-chrome

# BrowserStack debugging
debug: false
networkLogs: false
video: true
consoleLogs: info
