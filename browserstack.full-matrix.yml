# Full BrowserStack matrix used only when you intentionally want every OS/browser entry.
# Credentials: use environment variables; do not commit secrets
#userName: ${BROWSERSTACK_USERNAME}
#accessKey: ${BROWSERSTACK_ACCESS_KEY}

userName: rajbeer_jXrhp5
accessKey: ZaAcVpPXVzwjqztBUdaQ

projectName: OrangeHRM Playwright Automation
buildName: Cross Browser and Device Testing
buildIdentifier: '#${BUILD_NUMBER}'

framework: playwright
logLevel: error

platforms:

  # ---------- WINDOWS DESKTOP ----------

  - os: Windows
    osVersion: "11"
    browserName: chrome
    browserVersion: latest
    playwrightConfigOptions:
      name: windows-chrome

  - os: Windows
    osVersion: "10"
    browserName: chrome
    browserVersion: latest
    playwrightConfigOptions:
      name: windows10-chrome

  - os: Windows
    osVersion: "11"
    browserName: edge
    browserVersion: latest
    playwrightConfigOptions:
      name: windows-edge

  - os: Windows
    osVersion: "11"
    browserName: playwright-firefox
    playwrightConfigOptions:
      name: windows-firefox

  # ---------- MAC DESKTOP ----------

  - os: OS X
    osVersion: Sonoma
    browserName: playwright-webkit
    playwrightConfigOptions:
      name: macos-safari

  # ---------- ANDROID REAL DEVICES ----------

  - deviceName: Samsung Galaxy S25 Ultra
    osVersion: "15.0"
    browserName: chrome
    playwrightConfigOptions:
      name: samsung-s25-chrome

  - deviceName: Google Pixel 10
    osVersion: "16.0"
    browserName: chrome
    playwrightConfigOptions:
      name: pixel10-chrome

  - deviceName: Google Pixel 9
    osVersion: "16.0"
    browserName: chrome
    playwrightConfigOptions:
      name: pixel9-chrome

# BrowserStack debugging
debug: false
networkLogs: false
video: true
consoleLogs: info
